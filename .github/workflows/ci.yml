name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  check-code-format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install module
        run: |
          uv sync --extra dev

      - name: Check code with Ruff
        run: |
          uv run ruff check .

      - name: Check formatting with Ruff
        run: |
          uv run ruff format --check .

  run-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install module
        run: |
          uv sync --extra dev

      - name: Run pytest
        run: |
          uv run pytest -v tests/
